<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="FlatNav - 极简个人导航仪表盘" />
    <meta name="theme-color" content="#f0f4f8" />
    <title>FlatNav Dashboard</title>
    <link rel="icon" href="/favicon.ico" />
    <!-- 在样式生效前先套用缓存里的主题，避免深色用户看到白屏闪一下 -->
    <script>
      (function () {
        try {
          var cached = JSON.parse(localStorage.getItem('flatnav_config') || '{}');
          var theme = cached.theme || localStorage.getItem('flatnav_theme') || 'light';
          // 「跟随系统」要先解析成真实配色，否则首帧没有匹配的底色会闪白
          if (theme === 'auto') {
            var dark =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = dark ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <!-- 关键底色内联，避免主样式表到达前闪一帧白屏 -->
    <style>
      html[data-theme='light'] body { background-color: #f0f4f8; }
      html[data-theme='dark'] body { background-color: #0f172a; }
      html[data-theme='cyberpunk'] body { background-color: #050505; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
